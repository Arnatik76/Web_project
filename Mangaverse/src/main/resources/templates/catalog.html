<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Каталог', 'Каталог манги и манхвы: фильтры по жанру и формату, поиск.')}"></head>
<body th:data-icons="@{/img/icons.svg}">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="page-head">
        <h1 class="t-large">Каталог</h1>
        <p class="t-caption" th:text="${resultsLabel}">20 тайтлов</p>
    </div>

    <div class="toolbar">
        <div class="toolbar__row">
            <form class="field" method="get" th:action="@{/catalog}" role="search">
                <svg th:replace="~{fragments/layout :: icon('search')}"></svg>
                <label class="visually-hidden" for="catalog-q">Поиск по каталогу</label>
                <input class="field__input" id="catalog-q" type="search" name="q" th:value="${filter.q}"
                       placeholder="Название, автор или жанр" autocomplete="off">
                <input type="hidden" name="genre" th:if="${filter.genre != null}" th:value="${filter.genre}">
                <input type="hidden" name="type" th:if="${filter.type != null}" th:value="${#strings.toLowerCase(filter.type.name())}">
                <input type="hidden" name="sort" th:if="${filter.sort.name() != 'POPULAR'}" th:value="${#strings.toLowerCase(filter.sort.name())}">
            </form>

            <button class="btn btn--tinted filter-button" type="button" data-filters-open aria-haspopup="dialog"
                    th:with="active=${(filter.type != null ? 1 : 0) + (filter.genre != null ? 1 : 0)}">
                <svg th:replace="~{fragments/layout :: icon('sliders')}"></svg>Фильтры
                <span class="badge" th:if="${active > 0}" th:text="${active}">1</span>
            </button>

            <nav class="segmented toolbar__types" aria-label="Формат">
                <a class="segmented__item" th:href="${filter.withType(null).url}"
                   th:attr="aria-current=${filter.type == null ? 'true' : null}">Все</a>
                <a class="segmented__item" th:each="t : ${types}" th:href="${filter.withType(t).url}"
                   th:attr="aria-current=${filter.type == t ? 'true' : null}" th:text="${t.label}">Манга</a>
            </nav>

            <nav class="segmented toolbar__sort" aria-label="Сортировка">
                <a class="segmented__item" th:each="s : ${sorts}" th:href="${filter.withSort(s).url}"
                   th:attr="aria-current=${filter.sort == s ? 'true' : null}" th:text="${s.label}">Популярные</a>
            </nav>
        </div>

        <nav class="chips toolbar__genres" aria-label="Жанры">
            <a class="chip" th:href="${filter.withGenre(null).url}"
               th:attr="aria-current=${filter.genre == null ? 'true' : null}">Все жанры</a>
            <a class="chip" th:each="g : ${genres}" th:href="${filter.withGenre(g).url}"
               th:attr="aria-current=${filter.genre == g ? 'true' : null}" th:text="${g}">Жанр</a>
        </nav>
    </div>

    <section class="results" aria-labelledby="results-title">
        <h2 class="visually-hidden" id="results-title">Результаты</h2>
        <p class="results__summary" th:if="${filter.q != null}">
            Результаты по запросу «<span th:text="${filter.q}">запрос</span>» ·
            <a th:href="${filter.withoutQuery().url}">сбросить</a>
        </p>

        <div class="grid" th:unless="${results.isEmpty()}" data-results>
            <th:block th:each="m : ${results}"><a th:replace="~{fragments/layout :: card(${m})}"></a></th:block>
        </div>

        <!-- Works as a plain link; app.js turns it into infinite scroll. -->
        <div class="load-more" th:if="${nextPageUrl != null}">
            <a class="btn btn--tinted" th:href="${nextPageUrl}" data-load-more>Показать ещё</a>
        </div>

        <div class="empty" th:if="${results.isEmpty()}">
            <div class="empty__icon"><svg th:replace="~{fragments/layout :: icon('search')}"></svg></div>
            <p class="empty__title">Ничего не нашлось</p>
            <p>Попробуйте другой запрос или уберите часть фильтров.</p>
            <a class="btn btn--tinted" th:href="@{/catalog}">Сбросить фильтры</a>
        </div>
    </section>
</main>

<dialog class="sheet" data-filters-sheet aria-labelledby="filters-title">
    <div class="sheet__grabber" aria-hidden="true"></div>
    <div class="sheet__head">
        <h2 class="t-title" id="filters-title">Фильтры</h2>
        <button class="icon-btn" type="button" data-close aria-label="Закрыть">
            <svg th:replace="~{fragments/layout :: icon('x')}"></svg>
        </button>
    </div>
    <div class="sheet__body">
        <div class="sheet__group">
            <span class="sheet__label">Формат</span>
            <nav class="segmented segmented--full" aria-label="Формат">
                <a class="segmented__item" th:href="${filter.withType(null).url}"
                   th:attr="aria-current=${filter.type == null ? 'true' : null}">Все</a>
                <a class="segmented__item" th:each="t : ${types}" th:href="${filter.withType(t).url}"
                   th:attr="aria-current=${filter.type == t ? 'true' : null}" th:text="${t.label}">Манга</a>
            </nav>
        </div>
        <div class="sheet__group">
            <span class="sheet__label">Сортировка</span>
            <nav class="segmented segmented--full" aria-label="Сортировка">
                <a class="segmented__item" th:each="s : ${sorts}" th:href="${filter.withSort(s).url}"
                   th:attr="aria-current=${filter.sort == s ? 'true' : null}" th:text="${s.label}">Популярные</a>
            </nav>
        </div>
        <div class="sheet__group">
            <span class="sheet__label">Жанр</span>
            <nav class="chips chips--wrap" aria-label="Жанры">
                <a class="chip" th:href="${filter.withGenre(null).url}"
                   th:attr="aria-current=${filter.genre == null ? 'true' : null}">Все жанры</a>
                <a class="chip" th:each="g : ${genres}" th:href="${filter.withGenre(g).url}"
                   th:attr="aria-current=${filter.genre == g ? 'true' : null}" th:text="${g}">Жанр</a>
            </nav>
        </div>
        <a class="btn btn--tinted" th:href="@{/catalog}" th:if="${filter.filtered}">Сбросить всё</a>
    </div>
</dialog>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<nav th:replace="~{fragments/layout :: tabbar}"></nav>
<dialog th:replace="~{fragments/layout :: spotlight}"></dialog>
</body>
</html>
