spring.application.name=Mangaverse

# Database: credentials come from the environment, never from the repository.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mangaverse}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Schema is managed by Flyway migrations in db/migration.
spring.flyway.enabled=true
# db/demo adds placeholder chapters for trying the reader; drop it in production.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

# Russian dates and plurals regardless of the browser language.
spring.web.locale=ru
spring.web.locale-resolver=fixed

# Write endpoints require this token in the X-Admin-Token header. Empty = writes disabled.
mangaverse.admin-token=${MANGAVERSE_ADMIN_TOKEN:}

# Static resources: content-hashed URLs, so they can be cached for a year.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

server.mime-mappings.webmanifest=application/manifest+json
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/manifest+json,image/svg+xml

# Only the health endpoint is exposed.
management.endpoints.web.exposure.include=health

# Accounts: the account registered with this email becomes an administrator.
mangaverse.admin-email=${MANGAVERSE_ADMIN_EMAIL:}
# Secret for "remember me" cookies; without it they stop working after a restart.
mangaverse.remember-me-key=${REMEMBER_ME_KEY:}

# Uploaded chapter pages are stored here and served at /media/uploads/**.
mangaverse.media-dir=${MEDIA_DIR:media}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=600MB

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
